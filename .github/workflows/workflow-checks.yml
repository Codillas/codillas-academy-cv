name: Workflow checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow checks
    runs-on:
      group: gha-public-ci
      labels: [site-gha, os-linux, arch-x64]
    timeout-minutes: 5
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          trap 'rm -rf -- "$tool_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -color
